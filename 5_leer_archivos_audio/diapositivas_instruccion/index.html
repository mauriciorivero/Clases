<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcribe audio con Node.js</title>
  <meta name="description" content="Presentación interactiva: cómo construir una app Node.js que transcribe audio con Whisper de NVIDIA.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">▲</span> Transcribe audio con Node.js</div>
    <div class="topbar-right">
      <span class="counter" id="counter" aria-live="polite">01 / 01</span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="deck" aria-live="off"></main>

  <nav class="controls" aria-label="Navegación de diapositivas">
    <button class="icon-btn" id="prev" type="button" aria-label="Diapositiva anterior">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="dots" id="dots" role="tablist"></div>
    <button class="icon-btn" id="next" type="button" aria-label="Diapositiva siguiente">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>
  <div class="progress" aria-hidden="true"><i id="progress-bar"></i></div>

  <!-- Avatar: Byte -->
  <div class="avatar-wrap" id="avatar-wrap">
    <div class="bubble" id="bubble" role="status" aria-live="polite" hidden>
      <button class="bubble-close" id="bubble-close" type="button" aria-label="Cerrar pista">×</button>
      <p id="bubble-text"></p>
      <span class="bubble-meta" id="bubble-meta"></span>
    </div>
    <button class="avatar" id="avatar" type="button" aria-label="Byte, el asistente de código: haz clic para una pista">
      <span class="avatar-ping" id="avatar-ping" aria-hidden="true"></span>
      <svg viewBox="0 0 120 130" width="104" height="112" aria-hidden="true">
        <g class="av-body">
          <!-- antena -->
          <line x1="60" y1="14" x2="60" y2="28" class="av-stroke" stroke-width="4" stroke-linecap="round"/>
          <circle cx="60" cy="10" r="6" class="av-antenna"/>
          <!-- orejas -->
          <rect x="8" y="58" width="12" height="26" rx="6" class="av-ear"/>
          <rect x="100" y="58" width="12" height="26" rx="6" class="av-ear"/>
          <!-- cabeza -->
          <rect x="16" y="28" width="88" height="72" rx="24" class="av-head"/>
          <!-- pantalla -->
          <rect x="26" y="38" width="68" height="46" rx="16" class="av-screen"/>
          <!-- ojos -->
          <g id="av-eyes">
            <g class="av-eye" id="eye-l"><rect x="40" y="52" width="10" height="16" rx="5" class="av-pupil"/></g>
            <g class="av-eye" id="eye-r"><rect x="70" y="52" width="10" height="16" rx="5" class="av-pupil"/></g>
          </g>
          <!-- mejillas -->
          <ellipse cx="36" cy="76" rx="6" ry="3.5" class="av-blush"/>
          <ellipse cx="84" cy="76" rx="6" ry="3.5" class="av-blush"/>
          <!-- boca -->
          <path id="av-mouth" d="M52 76 Q60 82 68 76" class="av-mouth" fill="none" stroke-width="3.5" stroke-linecap="round"/>
          <!-- simbolo de codigo en la barbilla -->
          <text x="60" y="117" text-anchor="middle" class="av-code">&lt;/&gt;</text>
        </g>
      </svg>
    </button>
  </div>

  <noscript><p class="noscript">Esta presentación necesita JavaScript.</p></noscript>

  <script src="vendor/three.min.js"></script>
  <script src="slides.js"></script>
  <script src="app.js"></script>
</body>
</html>
