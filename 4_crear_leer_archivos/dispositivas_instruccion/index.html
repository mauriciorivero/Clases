<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivos con Node.js</title>
  <meta name="description" content="Presentación interactiva: crear, leer, actualizar y eliminar archivos con el módulo fs de Node.js, paso a paso.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="#1" aria-label="Ir a la portada">
      <span class="brand-mark">fs</span>
      <span class="brand-text">Archivos con Node.js</span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="btn-index" type="button" aria-label="Índice de diapositivas (tecla O)" title="Índice (O)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="Cambiar tema claro u oscuro (tecla T)" title="Tema (T)">
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="btn-full" type="button" aria-label="Pantalla completa (tecla F)" title="Pantalla completa (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </header>

  <main class="deck" id="deck"></main>

  <nav class="navbar" aria-label="Navegación de diapositivas">
    <div class="nav-pill">
      <button class="nav-btn" id="btn-prev" type="button" aria-label="Diapositiva anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="progress" id="progress"></div>
      <span class="counter" id="counter" aria-live="off">01 / 16</span>
      <button class="nav-btn nav-next" id="btn-next" type="button" aria-label="Diapositiva siguiente">
        <span class="nav-next-label">Siguiente</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </nav>

  <div class="bit" id="bit" data-mood="happy">
    <div class="bit-bubble" id="bit-bubble" aria-hidden="true">
      <div class="bb-head">
        <span class="bb-name">Bit</span>
        <span class="bb-count"></span>
        <button class="bb-close" type="button" aria-label="Cerrar mensaje de Bit">×</button>
      </div>
      <p class="bb-text" aria-hidden="true"></p>
      <div class="bb-actions">
        <button class="bb-next" type="button">Otra pista →</button>
      </div>
    </div>
    <button class="bit-btn" id="bit-btn" type="button" aria-label="Bit, tu asistente de código. Haz clic para recibir una pista (tecla H)">
      <svg class="bit-svg" viewBox="0 0 120 124" aria-hidden="true">
        <defs>
          <linearGradient id="bitGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" class="bit-stop-a"/>
            <stop offset="1" class="bit-stop-b"/>
          </linearGradient>
        </defs>
        <ellipse class="bit-shadow" cx="60" cy="117" rx="28" ry="4.5"/>
        <g class="bit-jump">
          <g class="bit-bob">
            <g class="bit-antenna">
              <line x1="60" y1="24" x2="60" y2="12"/>
              <circle class="bit-bulb" cx="60" cy="9" r="5"/>
            </g>
            <g class="bit-arm bit-arm-l"><rect x="5" y="58" width="17" height="10" rx="5"/></g>
            <g class="bit-arm bit-arm-r"><rect x="98" y="58" width="17" height="10" rx="5"/></g>
            <rect class="bit-foot" x="38" y="96" width="15" height="12" rx="6"/>
            <rect class="bit-foot" x="67" y="96" width="15" height="12" rx="6"/>
            <rect class="bit-shell" x="16" y="22" width="88" height="80" rx="24"/>
            <rect class="bit-shine" x="26" y="27" width="34" height="5" rx="2.5"/>
            <rect class="bit-screen" x="25" y="34" width="70" height="52" rx="16"/>
            <g class="bit-face">
              <ellipse class="bit-eye" cx="47" cy="56" rx="5.5" ry="7.5"/>
              <ellipse class="bit-eye" cx="73" cy="56" rx="5.5" ry="7.5"/>
              <circle class="bit-glint" cx="49" cy="52.5" r="1.7"/>
              <circle class="bit-glint" cx="75" cy="52.5" r="1.7"/>
              <ellipse class="bit-cheek" cx="35.5" cy="68" rx="5" ry="3"/>
              <ellipse class="bit-cheek" cx="84.5" cy="68" rx="5" ry="3"/>
              <path class="bit-mouth m-happy" d="M53 68 Q60 75 67 68"/>
              <ellipse class="bit-mouth m-wow" cx="60" cy="70" rx="3.6" ry="4.4"/>
              <path class="bit-mouth m-think" d="M54 70 L66 68"/>
            </g>
            <text class="bit-tag" x="60" y="97.5" text-anchor="middle">&lt;/&gt;</text>
          </g>
        </g>
      </svg>
      <span class="bit-badge" aria-hidden="true">?</span>
    </button>
  </div>

  <div class="overview" id="overview" aria-hidden="true">
    <div class="ov-panel" role="dialog" aria-modal="true" aria-labelledby="ov-title">
      <div class="ov-head">
        <h2 id="ov-title">Índice</h2>
        <button class="icon-btn" id="ov-close" type="button" aria-label="Cerrar índice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="ov-grid" id="ov-grid"></div>
      <div class="ov-keys">
        <span><kbd>←</kbd><kbd>→</kbd> navegar</span>
        <span><kbd>O</kbd> índice</span>
        <span><kbd>H</kbd> pista de Bit</span>
        <span><kbd>T</kbd> tema</span>
        <span><kbd>F</kbd> pantalla completa</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/components.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
