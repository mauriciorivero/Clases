<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Publica tu paquete npm</title>
  <meta name="description" content="Presentación interactiva: cómo construir y publicar el paquete sena-date en npm, paso a paso.">
  <meta name="color-scheme" content="dark light">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Aplica el tema guardado antes de pintar (evita parpadeo) -->
  <script src="js/theme-init.js"></script>
</head>
<body>
  <!-- Fondo animado 2D con three.js -->
  <canvas id="stage" class="stage" aria-hidden="true"></canvas>
  <div class="stage-fallback" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#1" aria-label="Ir a la portada">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2.5 21 7.5v9L12 21.5 3 16.5v-9L12 2.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.5 7.8 12 12.5l8.5-4.7M12 12.5v8.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand__name">sena-date</span>
      <span class="brand__sep">/</span>
      <span class="brand__sub">guía npm</span>
    </a>

    <div class="topbar__center">
      <span class="phase-pill" id="phasePill"><span class="phase-pill__dot"></span><span id="phasePillText">Introducción</span></span>
    </div>

    <div class="topbar__actions">
      <button class="icon-btn" id="indexBtn" type="button" aria-label="Abrir índice (tecla I)" title="Índice (I)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="icon-btn__label">Índice</span>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Cambiar tema claro u oscuro (tecla T)" title="Tema (T)">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="fsBtn" type="button" aria-label="Pantalla completa (tecla F)" title="Pantalla completa (F)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="deck" id="deck" aria-roledescription="presentación"></main>

  <nav class="controls" aria-label="Navegación de diapositivas">
    <button class="nav-btn" id="prevBtn" type="button" aria-label="Diapositiva anterior">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="dots" id="dots" role="tablist"></div>
    <span class="counter" id="counter" aria-live="polite">01 / 17</span>
    <button class="nav-btn nav-btn--primary" id="nextBtn" type="button" aria-label="Siguiente diapositiva">
      <span class="nav-btn__label" id="nextLabel">Siguiente</span>
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <div class="progress" aria-hidden="true"><div class="progress__bar" id="progressBar"></div></div>

  <!-- Índice -->
  <div class="index-panel" id="indexPanel" hidden>
    <div class="index-panel__backdrop" data-close></div>
    <div class="index-panel__sheet" role="dialog" aria-modal="true" aria-labelledby="indexTitle">
      <div class="index-panel__head">
        <h2 id="indexTitle">Índice</h2>
        <button class="icon-btn" type="button" data-close aria-label="Cerrar índice">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="index-panel__body" id="indexBody"></div>
    </div>
  </div>

  <!-- Avatar de código: Bit -->
  <div class="buddy" id="buddy">
    <div class="bubble" id="bubble" role="status" aria-live="polite" hidden>
      <div class="bubble__head">
        <span class="bubble__name">Bit</span>
        <span class="bubble__count" id="bubbleCount"></span>
        <button class="bubble__close" id="bubbleClose" type="button" aria-label="Cerrar pista">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="bubble__text" id="bubbleText"></p>
      <div class="bubble__foot">
        <span class="bubble__lines" id="bubbleLines"></span>
        <button class="bubble__next" id="bubbleNext" type="button">Otra pista <span aria-hidden="true">→</span></button>
      </div>
    </div>

    <button class="avatar" id="avatar" type="button" aria-label="Bit, tu asistente de código. Haz clic para recibir una pista (tecla H)">
      <span class="avatar__badge" aria-hidden="true">?</span>
      <svg class="avatar__svg" viewBox="0 0 120 130" aria-hidden="true">
        <defs>
          <linearGradient id="avBody" x1="0" y1="0" x2="0" y2="1">
            <stop class="av-stop-top" offset="0"/>
            <stop class="av-stop-bottom" offset="1"/>
          </linearGradient>
          <radialGradient id="avGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse class="av-shadow" cx="60" cy="122" rx="30" ry="5"/>
        <g class="av-body">
          <!-- antena -->
          <g class="av-antenna">
            <path d="M60 24 V12" class="av-stem" stroke-width="3.5" stroke-linecap="round"/>
            <circle class="av-bulb-glow" cx="60" cy="9" r="10" fill="url(#avGlow)"/>
            <circle class="av-bulb" cx="60" cy="9" r="5.5"/>
          </g>
          <!-- orejas { } -->
          <text class="av-ear av-ear--l" x="4" y="72">{</text>
          <text class="av-ear av-ear--r" x="101" y="72">}</text>
          <!-- cabeza -->
          <rect x="16" y="22" width="88" height="76" rx="26" fill="url(#avBody)"/>
          <rect x="16" y="22" width="88" height="76" rx="26" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>
          <!-- pantalla -->
          <rect class="av-screen" x="27" y="34" width="66" height="50" rx="16"/>
          <g class="av-face">
            <g class="av-eyes">
              <g class="av-eyes-open">
                <rect class="av-eye" x="41" y="49" width="9" height="13" rx="4.5"/>
                <rect class="av-eye" x="70" y="49" width="9" height="13" rx="4.5"/>
                <circle class="av-spark" cx="47.5" cy="52" r="1.6"/>
                <circle class="av-spark" cx="76.5" cy="52" r="1.6"/>
              </g>
              <g class="av-eyes-happy">
                <path d="M40 58 Q45.5 50 51 58" />
                <path d="M69 58 Q74.5 50 80 58" />
              </g>
              <g class="av-eyes-dizzy">
                <path d="M41 50 L50 59 M50 50 L41 59" />
                <path d="M70 50 L79 59 M79 50 L70 59" />
              </g>
            </g>
            <ellipse class="av-cheek" cx="37" cy="69" rx="5" ry="3"/>
            <ellipse class="av-cheek" cx="83" cy="69" rx="5" ry="3"/>
            <path class="av-mouth" d="M53 69 Q60 75 67 69"/>
          </g>
          <!-- brazos -->
          <rect class="av-arm av-arm--l" x="6" y="80" width="14" height="9" rx="4.5"/>
          <rect class="av-arm av-arm--r" x="100" y="80" width="14" height="9" rx="4.5"/>
          <!-- pies -->
          <rect class="av-foot" x="38" y="98" width="14" height="12" rx="6"/>
          <rect class="av-foot" x="68" y="98" width="14" height="12" rx="6"/>
        </g>
      </svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/slides-data.js"></script>
  <script src="js/highlighter.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/scene.js"></script>
</body>
</html>
